<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Overlay Counter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap');

  :root{
    --bg:#0b0e12;
    --panel:#12171e;
    --panel-2:#1a212b;
    --line:#28323f;
    --line-soft:#1f2833;
    --ink:#eaf1f8;
    --muted:#7f8ea0;
    --hot:#ff4e2b;        /* KILL: Apex orange */
    --cool:#54b8ff;       /* MATCH: steel blue  */
    --on:#33c964;
    --off:#3a4552;
    --radius:14px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Rajdhani",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }

  /* ---- view switching ---- */
  #app{min-height:100%;display:flex;flex-direction:column}
  .stage,.panel{display:none}
  #app[data-view="both"]{padding:22px;gap:22px}
  #app[data-view="both"] .stage,
  #app[data-view="both"] .panel{display:block}
  #app[data-view="both"] .stage{
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:34px 26px;
    background:
      linear-gradient(45deg,#0e1319 25%,transparent 25%) 0 0/24px 24px,
      linear-gradient(-45deg,#0e1319 25%,transparent 25%) 0 0/24px 24px,
      #0a0d11;
    position:relative;
  }
  #app[data-view="both"] .stage::after{
    content:"配信に映る側（背景は透過）";
    position:absolute;top:10px;right:14px;
    font-size:11px;letter-spacing:.08em;color:var(--muted);
  }
  #app[data-view="overlay"]{background:transparent}
  #app[data-view="overlay"] .stage{display:block;padding:0}
  #app[data-view="overlay"]{padding:0}
  #app[data-view="panel"] .panel{display:block}
  body:has(#app[data-view="overlay"]){background:transparent}

  /* ================= OVERLAY (flat, theme-driven) ================= */
  .hud{display:inline-flex;align-items:stretch;font-family:"Chakra Petch",sans-serif}
  .chip[data-metric="matches"]{--c:var(--cool)}
  .chip[data-metric="kills"]{--c:var(--hot)}
  .chip[hidden]{display:none !important}
  .chip__label{
    font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .chip__label small{font-weight:600;letter-spacing:.06em}
  .chip__value{
    font-weight:700;font-variant-numeric:tabular-nums;line-height:.95;letter-spacing:.01em;
  }
  @media (prefers-reduced-motion:no-preference){
    .chip__value.pulse{animation:pop .3s ease}
    @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
  }

  /* --- style: card (映像の上向け・落ち着いた面) --- */
  .hud[data-theme="card"]{gap:14px}
  .hud[data-theme="card"] .chip{
    background:#12171e;border-radius:12px;padding:12px 22px 14px;
    border-left:5px solid var(--c);
    display:flex;flex-direction:column;gap:3px;
  }
  .hud[data-theme="card"] .chip__label{font-size:13px;color:var(--c)}
  .hud[data-theme="card"] .chip__label small{color:var(--muted)}
  .hud[data-theme="card"] .chip__value{font-size:56px;color:#fff}

  /* --- style: bar (フレームの帯向け・横長で省スペース) --- */
  .hud[data-theme="bar"]{background:#12171e;border-radius:12px;overflow:hidden}
  .hud[data-theme="bar"] .chip{
    display:flex;align-items:center;gap:14px;padding:12px 26px;
  }
  .hud[data-theme="bar"] .chip + .chip{border-left:1px solid var(--line)}
  .hud[data-theme="bar"] .chip[hidden] + .chip{border-left:0}
  .hud[data-theme="bar"] .chip__label{font-size:15px;color:var(--c)}
  .hud[data-theme="bar"] .chip__label small{display:none}
  .hud[data-theme="bar"] .chip__value{font-size:42px;color:#fff}

  /* --- style: block (どんな背景でも視認◎・ベタ塗り) --- */
  .hud[data-theme="block"]{gap:14px}
  .hud[data-theme="block"] .chip{
    background:var(--c);border-radius:12px;padding:10px 22px 12px;
    display:flex;flex-direction:column;gap:1px;
  }
  .hud[data-theme="block"] .chip__label{font-size:13px;color:rgba(7,12,18,.72)}
  .hud[data-theme="block"] .chip__label small{color:rgba(7,12,18,.5)}
  .hud[data-theme="block"] .chip__value{font-size:56px;color:#0a0e13}

  /* --- style: hud (Apex風・角ばった半透明HUD／映像の上で映える) --- */
  .hud[data-theme="hud"]{gap:16px}
  .hud[data-theme="hud"] .chip{
    position:relative;min-width:148px;padding:12px 22px 14px 24px;
    background:linear-gradient(160deg,rgba(18,23,30,.92),rgba(10,13,17,.9));
    backdrop-filter:blur(3px);
    border-top:1px solid rgba(255,255,255,.08);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
    display:flex;flex-direction:column;gap:2px;
  }
  .hud[data-theme="hud"] .chip::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:var(--c);box-shadow:0 0 14px var(--c);
  }
  .hud[data-theme="hud"] .chip__label{font-size:13px;letter-spacing:.22em;color:var(--c)}
  .hud[data-theme="hud"] .chip__label small{color:var(--muted)}
  .hud[data-theme="hud"] .chip__value{
    font-size:58px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);
  }

  /* ================= CONTROL PANEL ================= */
  .panel{max-width:760px;margin:0 auto;width:100%}
  .panel__head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:16px;flex-wrap:wrap;gap:6px;
  }
  .panel__title{
    font-family:"Chakra Petch";font-weight:700;font-size:20px;letter-spacing:.12em;
    text-transform:uppercase;
  }
  .panel__title span{color:var(--hot)}
  .panel__hint{font-size:13px;color:var(--muted)}

  .styles{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .styles__label{
    font-family:"Chakra Petch";font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);
  }
  .seg{
    display:inline-flex;background:var(--panel);border:1px solid var(--line-soft);
    border-radius:10px;padding:4px;gap:4px;
  }
  .seg__btn{
    font-family:"Chakra Petch";font-weight:600;font-size:14px;letter-spacing:.04em;
    border:0;background:transparent;color:var(--muted);
    padding:8px 20px;border-radius:7px;cursor:pointer;
    transition:background .12s,color .12s;
  }
  .seg__btn:hover{color:var(--ink)}
  .seg__btn.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .seg__btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:640px){.cards{grid-template-columns:1fr}}

  .card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:16px;
    transition:border-color .15s,box-shadow .15s;
  }
  .card.active{border-color:var(--line)}
  .card[data-metric="matches"].active{box-shadow:inset 0 2px 0 var(--cool)}
  .card[data-metric="kills"].active{box-shadow:inset 0 2px 0 var(--hot)}

  .card__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card__label{
    font-family:"Chakra Petch";font-weight:600;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;
  }
  .card[data-metric="matches"] .card__label{color:var(--cool)}
  .card[data-metric="kills"] .card__label{color:var(--hot)}

  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch__track{
    width:42px;height:24px;border-radius:999px;background:var(--off);
    position:relative;transition:background .15s;
  }
  .switch__track::after{
    content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:#dfe7ef;transition:transform .15s;
  }
  .switch input:checked + .switch__track{background:var(--on)}
  .switch input:checked + .switch__track::after{transform:translateX(18px)}
  .switch input:focus-visible + .switch__track{outline:2px solid var(--ink);outline-offset:2px}
  .switch__text{font-size:12px;color:var(--muted);letter-spacing:.04em}

  .card__value{
    font-family:"Chakra Petch";font-weight:700;font-size:52px;line-height:1;
    text-align:center;padding:8px 0 12px;font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }
  .card__editnote{
    text-align:center;font-size:13px;height:18px;letter-spacing:.03em;
    margin-top:-4px;margin-bottom:8px;color:var(--muted);
    font-family:"Chakra Petch";font-variant-numeric:tabular-nums;
  }
  .card__editnote.plus{color:#7fe6a6}
  .card__editnote.minus{color:#ff9c88}

  .modeToggle{
    display:grid;grid-template-columns:1fr 1fr;gap:4px;
    background:var(--panel);border:1px solid var(--line-soft);
    border-radius:10px;padding:4px;margin-bottom:10px;
  }
  .mode__btn{
    font-family:"Chakra Petch";font-weight:600;font-size:14px;letter-spacing:.04em;
    border:0;background:transparent;color:var(--muted);
    padding:9px 0;border-radius:7px;cursor:pointer;transition:background .12s,color .12s;
  }
  .mode__btn:hover{color:var(--ink)}
  .mode__btn[data-mode="plus"].on{background:rgba(51,201,100,.16);color:#8ff0b0;box-shadow:inset 0 0 0 1px rgba(51,201,100,.42)}
  .mode__btn[data-mode="minus"].on{background:rgba(255,78,43,.16);color:#ffc2b3;box-shadow:inset 0 0 0 1px rgba(255,78,43,.44)}
  .mode__btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .adjust{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .keypad .span2{grid-column:span 2}

  button.btn{
    font-family:"Chakra Petch";font-weight:600;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ink);
    border-radius:10px;
    padding:14px 0;
    font-size:18px;
    cursor:pointer;
    transition:transform .05s,background .12s,border-color .12s;
    -webkit-user-select:none;user-select:none;
  }
  button.btn:hover{background:#222b36}
  button.btn:active{transform:translateY(1px)}
  button.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn.big{font-size:26px;padding:16px 0}
  .card[data-metric="matches"] .btn.accent{background:rgba(84,184,255,.14);border-color:rgba(84,184,255,.4);color:#cfe8ff}
  .card[data-metric="kills"] .btn.accent{background:rgba(255,78,43,.14);border-color:rgba(255,78,43,.42);color:#ffd0c4}
  .btn.set{background:var(--on);border-color:transparent;color:#052b12}
  .btn.set.minus{background:var(--hot);color:#2b0a04}
  .btn.set:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--muted);font-size:15px}

  .panel__foot{
    margin-top:16px;font-size:12px;color:var(--muted);line-height:1.6;
    border-top:1px solid var(--line-soft);padding-top:12px;
  }
  .panel__foot code{
    font-family:"Chakra Petch";color:var(--ink);background:var(--panel-2);
    padding:1px 6px;border-radius:5px;
  }
  kbd{
    font-family:"Chakra Petch";font-size:11px;background:var(--panel-2);
    border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;color:var(--ink);
  }
</style>
</head>
<body>
<div id="app" data-view="both">

  <!-- ===== 表示側（オーバーレイ） ===== -->
  <section class="stage">
    <div class="hud" id="hud" data-theme="hud">
      <div class="chip" data-metric="matches">
        <div class="chip__label">試合 <small>MATCH</small></div>
        <div class="chip__value" data-role="ov-matches">0</div>
      </div>
      <div class="chip" data-metric="kills">
        <div class="chip__label">キル <small>KILL</small></div>
        <div class="chip__value" data-role="ov-kills">0</div>
      </div>
    </div>
  </section>

  <!-- ===== 操作側（コントロールパネル） ===== -->
  <section class="panel">
    <div class="panel__head">
      <div class="panel__title">Apex <span>Counter</span> Control</div>
      <div class="panel__hint">クリックで対象を選択 → キーボード操作も可</div>
    </div>

    <div class="styles">
      <span class="styles__label">表示スタイル</span>
      <div class="seg" id="themeSeg">
        <button class="seg__btn" data-theme="hud">Apex</button>
        <button class="seg__btn" data-theme="card">カード</button>
        <button class="seg__btn" data-theme="bar">バー</button>
        <button class="seg__btn" data-theme="block">ブロック</button>
      </div>
    </div>

    <div class="cards" id="cards"></div>

    <div class="panel__foot">
      <div>ショートカット：<kbd>0-9</kbd> 即時入力 / <kbd>Space</kbd> ±切替 / <kbd>Enter</kbd> セット / <kbd>Esc</kbd> 取消 / <kbd>+</kbd> <kbd>-</kbd> ±1 / <kbd>Backspace</kbd> 1桁削除（選択中のカードに作用）</div>
      <div style="margin-top:6px">OBS設定：オーバーレイ＝<code>?view=overlay</code>（ブラウザソース） / パネル＝<code>?view=panel</code>（カスタムブラウザドック）</div>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const CLAMP_MAX = 9999;
  const KEY = "apex-overlay-state";
  const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("apex-overlay") : null;

  // ---- state ----
  const defaults = { matches:0, kills:0, showMatches:true, showKills:true, theme:"hud" };
  let state = load();

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) return Object.assign({}, defaults, JSON.parse(raw));
    }catch(e){}
    return Object.assign({}, defaults);
  }
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function broadcast(){
    persist();
    if(channel) channel.postMessage(state);
  }

  // ---- view mode ----
  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  const view = params.get("view");
  if(view === "overlay" || view === "panel"){ app.dataset.view = view; }
  const isPanel = app.dataset.view !== "overlay"; // panel/both can edit

  // ---- overlay rendering ----
  const ov = {
    hud:     document.getElementById("hud"),
    matches: document.querySelector('[data-role="ov-matches"]'),
    kills:   document.querySelector('[data-role="ov-kills"]'),
    chipM:   document.querySelector('.chip[data-metric="matches"]'),
    chipK:   document.querySelector('.chip[data-metric="kills"]'),
  };
  function renderOverlay(prev){
    ov.hud.dataset.theme = state.theme;
    setNum(ov.matches, state.matches, prev && prev.matches);
    setNum(ov.kills,   state.kills,   prev && prev.kills);
    ov.chipM.hidden = !state.showMatches;
    ov.chipK.hidden = !state.showKills;
  }
  function setNum(el, val, prevVal){
    el.textContent = val;
    if(prevVal !== undefined && prevVal !== val){
      el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
    }
  }

  // ---- control panel (only build if editable) ----
  const metrics = [
    { key:"matches", label:"試合数", showKey:"showMatches" },
    { key:"kills",   label:"キル数", showKey:"showKills" },
  ];
  const edit = {
    matches:{on:false,buf:"",mode:"plus",startVal:0},
    kills:  {on:false,buf:"",mode:"plus",startVal:0}
  };
  let activeMetric = "kills";
  const cardEls = {};

  function buildPanel(){
    const wrap = document.getElementById("cards");
    metrics.forEach(m => {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.metric = m.key;
      card.innerHTML = `
        <div class="card__head">
          <div class="card__label">${m.label}</div>
          <label class="switch">
            <input type="checkbox" data-toggle="${m.showKey}" ${state[m.showKey]?"checked":""}>
            <span class="switch__track"></span>
            <span class="switch__text">オーバーレイに表示</span>
          </label>
        </div>
        <div class="card__value" data-role="val">${state[m.key]}</div>
        <div class="card__editnote" data-role="note"></div>
        <div class="adjust">
          <button class="btn big accent" data-act="dec">−1</button>
          <button class="btn big accent" data-act="inc">＋1</button>
        </div>
        <div class="modeToggle" data-role="mode">
          <button class="mode__btn" data-mode="plus">＋ プラス</button>
          <button class="mode__btn" data-mode="minus">− マイナス</button>
        </div>
        <div class="keypad">
          <button class="btn" data-digit="1">1</button>
          <button class="btn" data-digit="2">2</button>
          <button class="btn" data-digit="3">3</button>
          <button class="btn" data-digit="4">4</button>
          <button class="btn" data-digit="5">5</button>
          <button class="btn" data-digit="6">6</button>
          <button class="btn" data-digit="7">7</button>
          <button class="btn" data-digit="8">8</button>
          <button class="btn" data-digit="9">9</button>
          <button class="btn ghost" data-act="back">⌫</button>
          <button class="btn" data-digit="0">0</button>
          <button class="btn ghost" data-act="reset">0に</button>
          <button class="btn set span2" data-act="set" data-role="setbtn">セット</button>
          <button class="btn ghost" data-act="clear">取消</button>
        </div>`;
      wrap.appendChild(card);
      cardEls[m.key] = card;

      card.addEventListener("click", () => setActive(m.key));

      card.querySelector('[data-toggle]').addEventListener("change", (e) => {
        state[e.target.dataset.toggle] = e.target.checked;
        renderOverlay(); broadcast();
      });

      card.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if(!b) return;
        if(b.dataset.digit !== undefined) inputDigit(m.key, b.dataset.digit);
        else if(b.dataset.mode) setMode(m.key, b.dataset.mode);
        else handleAct(m.key, b.dataset.act);
      });
    });
    renderPanel();
  }

  function setActive(key){
    if(key !== activeMetric){
      const prev = edit[activeMetric];      // confirm any edit on the card we're leaving
      if(prev && prev.on){ prev.on = false; prev.buf = ""; }
    }
    activeMetric = key;
    metrics.forEach(m => cardEls[m.key].classList.toggle("active", m.key===key));
  }

  function renderPanel(){
    metrics.forEach(m => {
      const card = cardEls[m.key];
      const e = edit[m.key];
      const valEl  = card.querySelector('[data-role="val"]');
      const noteEl = card.querySelector('[data-role="note"]');

      card.classList.toggle("editing", e.on);
      valEl.textContent = state[m.key];

      card.querySelectorAll('.mode__btn').forEach(b =>
        b.classList.toggle("on", b.dataset.mode === e.mode));

      noteEl.classList.remove("plus","minus");
      if(e.on){
        const sign = e.mode === "plus" ? "＋" : "−";
        noteEl.textContent = `編集中 ${sign}${e.buf || "0"}（取消で ${e.startVal} に戻す）`;
        noteEl.classList.add(e.mode);
      }else{
        noteEl.textContent = "";
      }

      card.querySelector('[data-toggle]').checked = state[m.showKey];
    });
  }

  function clamp(n){ n = parseInt(n,10)||0; return Math.max(0, Math.min(CLAMP_MAX, n)); }

  // live value = baseline captured at edit start, ± typed amount
  function recompute(key){
    const e = edit[key];
    const amt = parseInt(e.buf || "0", 10);
    state[key] = clamp(e.startVal + (e.mode === "plus" ? amt : -amt));
  }

  function setMode(key, mode){
    setActive(key);
    edit[key].mode = mode;
    if(edit[key].on){ recompute(key); renderOverlay(); broadcast(); }
    renderPanel();
  }

  function inputDigit(key, d){
    setActive(key);
    const e = edit[key];
    if(!e.on){ e.on = true; e.buf = ""; e.startVal = state[key]; }
    e.buf = (e.buf + d).replace(/^0+(?=\d)/, "").slice(0,4);
    recompute(key);                              // 数字を押した瞬間に反映
    renderPanel(); renderOverlay(); broadcast();
  }

  function handleAct(key, act){
    setActive(key);
    const e = edit[key];
    switch(act){
      case "inc":  e.on=false; e.buf=""; state[key]=clamp(state[key]+1); break;
      case "dec":  e.on=false; e.buf=""; state[key]=clamp(state[key]-1); break;
      case "reset":e.on=false; e.buf=""; state[key]=0; break;
      case "back":
        if(e.on){ e.buf=e.buf.slice(0,-1); recompute(key);
                  renderPanel(); renderOverlay(); broadcast(); }
        return;
      case "set":                                // セット：現在値をそのまま確定
        e.on=false; e.buf=""; renderPanel(); return;
      case "clear":                              // 取消：入力を始める前の値に戻す
        if(e.on){ state[key]=e.startVal; e.on=false; e.buf="";
                  renderPanel(); renderOverlay(); broadcast(); }
        else renderPanel();
        return;
      default: return;
    }
    renderPanel(); renderOverlay(); broadcast();
  }

  // ---- style switcher ----
  const themeSeg = document.getElementById("themeSeg");
  function renderThemeSeg(){
    if(!themeSeg) return;
    themeSeg.querySelectorAll('.seg__btn').forEach(b =>
      b.classList.toggle("on", b.dataset.theme === state.theme));
  }
  function wireThemeSwitcher(){
    if(!themeSeg) return;
    themeSeg.addEventListener("click", (e) => {
      const b = e.target.closest(".seg__btn");
      if(!b) return;
      state.theme = b.dataset.theme;
      renderOverlay(); renderThemeSeg(); broadcast();
    });
    renderThemeSeg();
  }

  // ---- keyboard ----
  if(isPanel){
    document.addEventListener("keydown", (ev) => {
      if(ev.target.matches("input,textarea")) return;
      const k = ev.key;
      if(/^[0-9]$/.test(k)){ inputDigit(activeMetric, k); ev.preventDefault(); }
      else if(k==="+"||k==="="){ handleAct(activeMetric,"inc"); ev.preventDefault(); }
      else if(k==="-"){ handleAct(activeMetric,"dec"); ev.preventDefault(); }
      else if(k==="Enter"){ handleAct(activeMetric,"set"); ev.preventDefault(); }
      else if(k===" "){ setMode(activeMetric, edit[activeMetric].mode==="plus"?"minus":"plus"); ev.preventDefault(); }
      else if(k==="Backspace"){ handleAct(activeMetric,"back"); ev.preventDefault(); }
      else if(k==="Escape"){ handleAct(activeMetric,"clear"); ev.preventDefault(); }
      else if(k==="Tab"){ setActive(activeMetric==="matches"?"kills":"matches"); ev.preventDefault(); }
    });
  }

  // ---- receive updates from the other context (panel -> overlay) ----
  function applyExternal(next){
    const prev = { matches:state.matches, kills:state.kills };
    state = Object.assign({}, defaults, next);
    renderOverlay(prev);
    if(isPanel && document.getElementById("cards").children.length){ renderPanel(); renderThemeSeg(); }
  }
  if(channel){ channel.onmessage = (e) => applyExternal(e.data); }
  window.addEventListener("storage", (e) => {
    if(e.key === KEY && e.newValue){
      try{ applyExternal(JSON.parse(e.newValue)); }catch(err){}
    }
  });

  // ---- init ----
  renderOverlay();
  if(isPanel){ buildPanel(); setActive(activeMetric); wireThemeSwitcher(); }
})();
</script>
</body>
</html>
